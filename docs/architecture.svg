<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" font-size="14" fill="#222" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>

  <!-- Background (keeps diagram readable in GitHub dark mode) -->
  <rect x="0" y="0" width="720" height="440" fill="#FFFFFF"/>

  <!-- Outer daemon box -->
  <rect x="10" y="10" width="700" height="420" rx="6" fill="none" stroke="#222" stroke-width="1.5"/>
  <text x="360" y="38" text-anchor="middle" font-weight="bold" font-size="16">meshcore_bridge daemon</text>

  <!-- SharedData A + Worker A -->
  <rect x="40" y="60" width="220" height="90" rx="4" fill="none" stroke="#222" stroke-width="1.2"/>
  <text x="58" y="88">SharedData A</text>
  <text x="58" y="110">+ Worker A</text>
  <text x="58" y="132">(ttyUSB1)</text>

  <!-- SharedData B + Worker B -->
  <rect x="40" y="180" width="220" height="90" rx="4" fill="none" stroke="#222" stroke-width="1.2"/>
  <text x="58" y="208">SharedData B</text>
  <text x="58" y="230">+ Worker B</text>
  <text x="58" y="252">(ttyUSB2)</text>

  <!-- BridgeEngine -->
  <rect x="400" y="60" width="280" height="210" rx="4" fill="none" stroke="#222" stroke-width="1.2"/>
  <text x="418" y="88" font-weight="bold">BridgeEngine</text>
  <text x="418" y="118">- multi-pair forward</text>
  <text x="418" y="142">- direction filter</text>
  <text x="418" y="166">- loop prevention</text>

  <!-- Connections -->
  <line x1="262" y1="105" x2="398" y2="105" stroke="#222" stroke-width="1.4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="262" y1="225" x2="398" y2="225" stroke="#222" stroke-width="1.4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Bridge Dashboard -->
  <rect x="40" y="300" width="640" height="110" rx="4" fill="none" stroke="#222" stroke-width="1.2"/>
  <text x="58" y="328" font-weight="bold">Bridge Dashboard (NiceGUI :9092)</text>
  <text x="58" y="352">- Device A &amp; B status</text>
  <text x="58" y="374">- Bridge configuration panel (3-panel)</text>
  <text x="58" y="396">- Forwarded message log</text>
</svg>
